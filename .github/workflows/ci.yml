name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -count=1 is the documented way to disable the test cache. Without it a
      # run can report "ok (cached)", which is a statement about some earlier
      # commit — and the commit that just landed is the only one CI exists to
      # judge.
      - name: test
        run: go test ./... -count=1

      # gofmt exits 0 whether or not it found anything, so the check has to be on
      # its output rather than its status. Printing the list matters: "gofmt
      # failed" with nothing after it turns a ten-second fix into a search.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # The sandbox is the one component whose tests are not about whether it
  # computes the right answer. Most of them run a genuinely hostile submission —
  # an infinite loop, a fork bomb, a ten-gigabyte allocation — and assert that it
  # was contained and that nothing was left running. They need a real Linux
  # kernel for rlimits, seccomp and /proc, which is what this runner is, and they
  # take about ten seconds.
  #
  # 3.12 to match the image. The jail raises Python's recursion limit past the
  # point where a pre-3.11 interpreter would segfault instead of raising, so
  # testing on a different minor is testing a different jail.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step, because there is nothing to install. The service is
      # stdlib-only and the tests are unittest — see sandbox/Dockerfile for why
      # that is a property worth keeping rather than a stage nobody got round to.
      - name: test
        run: python3 -m unittest discover -s sandbox/tests -v

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only, never push. The image builds see things `go build` on the
      # runner cannot — a missing go:embed asset, a broken pip pin — and a
      # Dockerfile that no longer builds should fail the pull request rather than
      # the publish job that runs once it has already merged.
      #
      # Single-platform here on purpose: the arm64 leg is qemu-emulated and slow,
      # and publish.yml covers it. This job is about catching breakage early.
      - name: router image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=ci-discrimen
          cache-to: type=gha,mode=max,scope=ci-discrimen

      - name: embeddings image
        uses: docker/build-push-action@v7
        with:
          context: ./embeddings
          file: embeddings/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-discrimen-embeddings
          cache-to: type=gha,mode=max,scope=ci-discrimen-embeddings

      - name: sandbox image
        uses: docker/build-push-action@v7
        with:
          context: ./sandbox
          file: sandbox/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-discrimen-sandbox
          cache-to: type=gha,mode=max,scope=ci-discrimen-sandbox
