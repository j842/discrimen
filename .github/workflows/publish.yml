name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]

# GITHUB_TOKEN is read-only by default; packages:write is what lets it push to
# ghcr.io, and contents stays read because nothing here writes to the repo.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # A matrix rather than two near-identical jobs: the images differ only in
      # name and build context, so duplicating the steps would just be two places
      # to forget to update.
      matrix:
        include:
          - image: discrimen
            context: .
            dockerfile: Dockerfile
          - image: discrimen-embeddings
            context: ./embeddings
            dockerfile: embeddings/Dockerfile

    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on an amd64 runner. Without qemu registered, buildx has
      # no way to execute the arm64 leg and the multi-arch manifest cannot be
      # produced at all.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest only on the default branch, so a tag build never quietly moves it
      # backwards. The sha tag is the one worth pinning to in a deployment —
      # latest and the semver tags both move.
      - name: tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/j842/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image so the two matrix legs do not evict each other's
          # cache. mode=max keeps the intermediate stages, which is what makes a
          # rebuild after a source-only change cheap.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
