name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]

# GITHUB_TOKEN is read-only by default; packages:write is what lets it push to
# ghcr.io, and contents stays read because nothing here writes to the repo.
permissions:
  contents: read
  packages: write

# Each architecture builds on its NATIVE runner — ubuntu-24.04-arm is free for
# public repos — and a merge job stitches the per-arch digests into one
# multi-arch manifest. Nothing runs under qemu emulation anywhere: the old
# single-runner shape emulated the whole arm64 leg, which spent ~20 minutes
# compiling modernc.org/sqlite before the Dockerfile learned to cross-compile,
# and still emulated the embeddings pip install after. The per-arch legs run in
# parallel, so wall time is the slower leg plus a seconds-long merge.
#
# The build legs push by DIGEST only, no tags: a half-published state is a pair
# of untagged blobs nobody can pull by name, and the tags only ever appear on
# the assembled manifest in the merge job — so `latest` moves atomically.
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # One leg per (image, arch): the images differ only in name and build
      # context, the legs only in runner — the matrix is the single place to
      # update either list.
      matrix:
        include:
          - image: discrimen
            context: .
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: discrimen
            context: .
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: discrimen-embeddings
            context: ./embeddings
            dockerfile: embeddings/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: discrimen-embeddings
            context: ./embeddings
            dockerfile: embeddings/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # The sandbox builds per-arch like the others even though it compiles
          # nothing: jail.py carries a syscall number per architecture for its
          # seccomp filter, so an amd64-only manifest would run under emulation
          # on an arm64 host and the filter would be checking the wrong table.
          - image: discrimen-sandbox
            context: ./sandbox
            dockerfile: sandbox/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: discrimen-sandbox
            context: ./sandbox
            dockerfile: sandbox/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      # "linux/arm64" is not a legal artifact name; everything downstream keys
      # on the flattened form.
      - name: flatten platform for the artifact name
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here — the tags are computed and applied in the merge job,
      # on the assembled manifest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/j842/${{ matrix.image }}

      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/j842/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per (image, arch) so the four legs do not evict each other's
          # cache. mode=max keeps the intermediate stages, which is what makes a
          # rebuild after a source-only change cheap.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}

      # The digest travels to the merge job as an empty file NAMED by the
      # digest — the filename is the data.
      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # One image's failed merge must not cancel the other's publish.
      fail-fast: false
      matrix:
        include:
          - image: discrimen
          - image: discrimen-embeddings
          - image: discrimen-sandbox
    steps:
      # "-linux-" is load-bearing: "discrimen" is a prefix of
      # "discrimen-embeddings", so "digests-discrimen-*" would also download
      # the embeddings digests and stitch them into the discrimen manifest —
      # blobs that live in the other repository, so the create step fails.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-linux-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest only on the default branch, so a tag build never quietly moves it
      # backwards. The sha tag is the one worth pinning to in a deployment —
      # latest and the semver tags both move.
      - name: tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/j842/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/j842/${{ matrix.image }}@sha256:%s ' *)

      - name: inspect
        run: docker buildx imagetools inspect ghcr.io/j842/${{ matrix.image }}:${{ steps.meta.outputs.version }}
